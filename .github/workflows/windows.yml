name: Windows tests and EXE build

on:
  push:
    branches: [main, "feat/**", "stability/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install ".[test,build]"
      - name: Ruff static checks
        run: python -m ruff check src tests --select E4,E7,E9,F
      - name: Unit tests
        run: python -m pytest -q
      - name: Compile Python files
        run: python -m compileall -q src
      - name: Package EXE (Microsoft Edge required on target PC)
        shell: pwsh
        run: ./build/windows_build.ps1
      - name: Packaged EXE startup smoke test
        shell: pwsh
        run: |
          $process = Start-Process -FilePath 'dist/AirWaveCsvExporter/AirWaveCsvExporter.exe' -ArgumentList '--help' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'EXE startup failed' }
      - name: Validate frozen EXE 3/5 real worker processes (fail closed)
        shell: pwsh
        run: |
          python tests/support/frozen_worker_smoke.py --exe dist/AirWaveCsvExporter/AirWaveCsvExporter.exe
      - name: Two-minute Windows OS-worker soak
        shell: pwsh
        run: |
          python tests/support/soak_process_pool.py --minutes 2 --servers 5 --report test-results/worker-soak-short.json
      - name: Upload synthetic worker soak metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AirWaveWorkerSoak-Short
          path: test-results/worker-soak-short.json
          if-no-files-found: warn
          retention-days: 14
      - name: Upload Windows EXE (folder must remain intact)
        uses: actions/upload-artifact@v4
        with:
          name: AirWaveCsvExporter-Windows
          path: dist/AirWaveCsvExporter/
          if-no-files-found: error
          retention-days: 14

  linux-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ".[test]"
      - run: python -m ruff check src tests --select E4,E7,E9,F
      - run: python -m pytest -q
