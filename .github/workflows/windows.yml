name: Windows tests and EXE build

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install ".[test,build]"
      - name: Unit tests
        run: python -m pytest -q
      - name: Compile Python files
        run: python -m compileall -q src
      - name: Package EXE (Microsoft Edge required on target PC)
        shell: pwsh
        run: ./build/windows_build.ps1
      - name: Upload Windows EXE (folder must remain intact)
        uses: actions/upload-artifact@v4
        with:
          name: AirWaveCsvExporter-Windows
          path: dist/AirWaveCsvExporter/
          if-no-files-found: error
          retention-days: 14

  linux-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ".[test]"
      - run: python -m pytest -q
